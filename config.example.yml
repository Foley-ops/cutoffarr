# Example cutoffarr configuration.
#
# Copy this file to config.yml (or set --config to point at your own copy)
# and fill in real values. config.yml is gitignored — never commit it, since
# it holds real API keys.
#
# Run modes:
#   cutoffarr --config config.yml           daemon: startup scan, then the
#                                           webhook listener and a
#                                           reconciliation sweep every
#                                           poll_interval, until SIGTERM
#   cutoffarr --config config.yml --once    a single pass, then exit

dry_run: true            # MUST default to true if absent. Set false only when ready.
poll_interval: 24h       # reconciliation full sweep; Go duration; min 1h; 0 disables
webhook_port: 9898       # port the webhook listener binds; endpoint is
                         #   POST /webhook/{instance-name} — e.g.
                         #   http://cutoffarr:9898/webhook/radarr-main
                         # Point each *arr's "Connect -> Webhook" at its OWN
                         # name here, with On Import and On Upgrade ticked.
webhook_debounce: 45s    # wait after the LAST event for a movie/series before
                         # evaluating it; a season-pack import is one evaluation,
                         # not one per episode. 0 evaluates without waiting.
                         # An event is decided against the WHOLE library as
                         # evidence but may only WRITE what it named: that movie,
                         # or that series' affected season(s). Anything else that
                         # has become eligible waits for the reconciliation sweep.
log_level: info          # debug | info | warn | error
exclusion_tag: cutoffarr-exclude

reverse_scan_remonitor: false
                         # The reverse scan runs on every full cycle (startup
                         # scan, reconciliation sweep, --once) and REPORTS items
                         # that are unmonitored while still failing the criteria
                         # — usually an accidental unmonitor. Reporting is
                         # unconditional; this flag is only about writing.
                         # false (the default) means the reverse scan composes
                         # no write of any kind, ever. true lets it re-monitor
                         # what it finds, obeying dry_run and the exclusion tag
                         # exactly like the forward path. Sonarr seasons under
                         # an UNMONITORED series are always report-only: a
                         # series-level unmonitor is a deliberate retirement.
                         # With it on, --once --only-id N runs BOTH directions
                         # against that one item and nothing else, which is how
                         # to try a re-monitor deliberately before letting a
                         # full cycle make them. With it off, scoped runs stay
                         # forward-only.
                         # A Sonarr season that already has MONITORED episodes
                         # inside it is report-only too: re-monitoring is for
                         # the clean case (the flag off and every episode under
                         # it off), and a mixed state is indistinguishable from
                         # one a human made by hand, so it is reported every
                         # cycle and never written either way.

# gui_actions (v2.2): the master switch for the dashboard's per-finding
# BUTTONS — trash a duplicate/orphan, merge a case-twin folder, re-monitor one
# item. Default false, which is what an absent key means, so every config
# written before v2.2 keeps behaving exactly as it did.
#
# Read this before turning it on. The permanent no-file-writes rule has NOT
# been weakened: it binds the AUTOMATION. No sweep, webhook, reconciliation or
# startup path can reach a file operation with this true or false — the
# executors are reachable only from the action endpoint, which only a human's
# confirmed POST arrives at. What this flag decides is whether cutoffarr will
# act as YOUR hand when you click a button that states its exact operation.
#
# Three things are true whatever you set it to:
#   - Nothing is ever deleted. Every removal is a rename-move into
#     <media-root>/.cutoffarr-trash/<timestamp>/<original path>, which is never
#     auto-pruned and never walked by the file report. You empty it yourself.
#   - Every action re-derives its finding from live data first and refuses if
#     the world has moved on (file gone, size changed, twin already merged,
#     item already monitored).
#   - dry_run still wins. With dry_run: true every button REHEARSES: full
#     verification, then a "here is what I would have done" answer.
#
# It also needs the media volume mounted :rw — the deploy default is :ro on
# purpose. See docker-compose.example.yml's ACTIONS-ENABLED VARIANT block and
# the README's "Acting on findings" section.
#
# gui_actions: false

instances:
  - name: radarr-main    # unique, used in logs
    type: radarr         # radarr | sonarr
    url: http://radarr:7878
    api_key: ${RADARR_MAIN_API_KEY}
    # media_root_map (Phase 11): opt-in, per instance, absent by default.
    # Maps this *arr's own root folder path to the same path as cutoffarr's
    # own filesystem sees it, so the read-only duplicate & orphan file report
    # can walk your media and compare it against what Radarr actually
    # tracks. Absent means the file report never runs for this instance —
    # no disk access of any kind. Requires the matching :ro media volume in
    # docker-compose.yml (see docker-compose.example.yml) and every key/
    # value below must be a non-empty absolute path. See the README's "The
    # file report" section — it never writes, deletes, moves, or renames
    # anything, permanently, with no flag to change that.
    # media_root_map:
    #   /movies: /data/media/Movies
  - name: sonarr-main
    type: sonarr
    url: http://sonarr:8989
    api_key: ${SONARR_MAIN_API_KEY}
    # media_root_map:
    #   /tv_shows: /data/media/TV_Shows
    #   /anime: /data/media/Anime
